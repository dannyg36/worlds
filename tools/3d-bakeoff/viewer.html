<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">
{ "imports": { "three": "/h/node_modules/three/build/three.module.js", "three/addons/": "/h/node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
import { KTX2Loader } from "three/addons/loaders/KTX2Loader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
document.body.appendChild(renderer.domElement);
const pmrem = new THREE.PMREMGenerator(renderer);
const envTexture = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const draco = new DRACOLoader().setDecoderPath("/h/node_modules/three/examples/jsm/libs/draco/gltf/");
const ktx2 = new KTX2Loader().setTranscoderPath("/h/node_modules/three/examples/jsm/libs/basis/").detectSupport(renderer);
const loader = new GLTFLoader().setDRACOLoader(draco).setKTX2Loader(ktx2).setMeshoptDecoder(MeshoptDecoder);

let current = null;

window.loadGlb = async (url, { yaw = 0, background = "#e6e6ea" } = {}) => {
  if (current) {
    current.traverse((o) => {
      o.geometry?.dispose();
      const mats = Array.isArray(o.material) ? o.material : o.material ? [o.material] : [];
      for (const m of mats) {
        for (const v of Object.values(m)) if (v && v.isTexture) v.dispose();
        m.dispose();
      }
    });
  }
  const t0 = performance.now();
  const gltf = await loader.loadAsync(url);
  const loadMs = performance.now() - t0;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(background);
  scene.environment = envTexture;
  const key = new THREE.DirectionalLight(0xffffff, 1.0);
  key.position.set(2, 4, 3);
  scene.add(key);
  const root = gltf.scene;
  const box = new THREE.Box3().setFromObject(root);
  const center = box.getCenter(new THREE.Vector3());
  const sphere = box.getBoundingSphere(new THREE.Sphere());
  root.position.sub(center);
  const pivot = new THREE.Group();
  pivot.add(root);
  pivot.scale.setScalar(1 / (sphere.radius || 1));
  pivot.rotation.y = (yaw * Math.PI) / 180;
  scene.add(pivot);
  root.traverse((o) => {
    if (o.isPoints) {
      o.material.size = 2;
      o.material.sizeAttenuation = false;
    }
  });
  current = scene;
  const size = box.getSize(new THREE.Vector3());
  return { loadMs: Math.round(loadMs), size: size.toArray() };
};

window.renderViews = (views, { size = 768, fov = 30, margin = 1.02 } = {}) => {
  renderer.setSize(size, size);
  const camera = new THREE.PerspectiveCamera(fov, 1, 0.01, 100);
  const dist = margin / Math.sin(((fov / 2) * Math.PI) / 180);
  const images = [];
  let drawMs = 0;
  for (const [azimuth, elevation] of views) {
    const a = (azimuth * Math.PI) / 180;
    const e = (elevation * Math.PI) / 180;
    camera.position.set(dist * Math.cos(e) * Math.sin(a), dist * Math.sin(e), dist * Math.cos(e) * Math.cos(a));
    camera.lookAt(0, 0, 0);
    const t0 = performance.now();
    renderer.render(current, camera);
    drawMs += performance.now() - t0;
    images.push(renderer.domElement.toDataURL("image/png"));
  }
  return { images, drawMs: Math.round(drawMs), triangles: renderer.info.render.triangles };
};
window.viewerReady = true;
</script>
</body>
</html>
