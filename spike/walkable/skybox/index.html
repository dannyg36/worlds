<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>worlds · skybox spike</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; top: calc(env(safe-area-inset-top) + 50px); left: calc(env(safe-area-inset-left) + 6px); margin: 0; padding: 5px 7px; background: rgba(0, 0, 0, .5); color: #e9f2e9; font: 9.5px/1.36 ui-monospace, Menlo, monospace; white-space: pre; border-radius: 8px; pointer-events: none; max-width: calc(100vw - 24px); overflow: hidden; }
  #hud.off { display: none; }
  #top { position: fixed; top: calc(env(safe-area-inset-top) + 6px); left: calc(env(safe-area-inset-left) + 6px); right: calc(env(safe-area-inset-right) + 6px); display: flex; justify-content: space-between; gap: 6px; }
  #title { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 108px); text-align: center; color: #fff; font: 600 15px -apple-system, system-ui, sans-serif; text-shadow: 0 1px 6px rgba(0, 0, 0, .6); pointer-events: none; }
  #panorow { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 64px); display: flex; justify-content: center; }
  .seg { display: flex; background: rgba(0, 0, 0, .5); border-radius: 999px; padding: 3px; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .seg button, .seg a { appearance: none; border: 0; background: transparent; color: #fff; font: 600 13px -apple-system, system-ui, sans-serif; padding: 8px 11px; border-radius: 999px; text-decoration: none; line-height: 1; }
  .seg .on { background: rgba(255, 255, 255, .92); color: #111; }
  .seg button:disabled { opacity: .35; }
  select { appearance: none; -webkit-appearance: none; border: 0; border-radius: 999px; padding: 8px 14px; background: rgba(0, 0, 0, .5); color: #fff; font: 600 12px -apple-system, system-ui, sans-serif; max-width: 86vw; text-align: center; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 14px); display: flex; gap: 6px; }
  #joy { position: fixed; width: 116px; height: 116px; margin: -58px 0 0 -58px; border-radius: 50%; background: rgba(255, 255, 255, .10); border: 2px solid rgba(255, 255, 255, .35); pointer-events: none; display: none; }
  #joy.hint { display: block; opacity: .55; }
  #joy.live { display: block; opacity: 1; }
  #knob { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; background: rgba(255, 255, 255, .78); }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #e8e8e8; font: 14px/1.5 -apple-system, system-ui, sans-serif; background: #0b0b0e; text-align: center; white-space: pre-line; }
  #loading.done { display: none; }
  #err { position: fixed; bottom: calc(env(safe-area-inset-bottom) + 136px); left: 8px; right: 8px; color: #ffb4b4; font: 11px ui-monospace, Menlo, monospace; white-space: pre-wrap; pointer-events: none; text-shadow: 0 1px 2px #000; }
  #recdot { color: #ff5b5b; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="c"></canvas>
<pre id="hud"></pre>
<div id="top">
  <div class="seg" id="days"></div>
  <div class="seg"><button id="tour">Tour</button><button id="rec">Rec</button><button id="hudbtn">HUD</button></div>
</div>
<div id="title"></div>
<div id="panorow"><select id="pano" aria-label="Panorama method"></select></div>
<div id="joy"><div id="knob"></div></div>
<div class="bar">
  <div class="seg" id="modes"><button data-mode="orbit">Orbit</button><button data-mode="stand">Stand</button></div>
  <div class="seg" id="scales"><button data-scale="table">Table</button><button data-scale="life">Life</button></div>
  <div class="seg"><button id="gyro">Gyro</button></div>
</div>
<div id="err"></div>
<div id="loading">Loading…</div>
<script type="module" src="./main.js"></script>
</body>
</html>
