<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>worlds · pano3d</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; overscroll-behavior: none; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; font-family: -apple-system, system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; }
  #hud { position: fixed; top: calc(env(safe-area-inset-top) + 4px); left: 4px; right: 4px; font: 10px/1.3 ui-monospace, Menlo, monospace; color: #eafff0; background: rgba(0,0,0,.5); padding: 5px 7px; border-radius: 8px; pointer-events: none; white-space: pre-wrap; word-break: break-word; }
  #hud.off { display: none; }
  #bar { position: fixed; right: 10px; bottom: calc(env(safe-area-inset-bottom) + 26px); display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  #bar button { font: 600 14px -apple-system, system-ui, sans-serif; color: #fff; background: rgba(20,20,24,.62); border: 1px solid rgba(255,255,255,.35); border-radius: 22px; padding: 9px 14px; min-width: 64px; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  #bar button.on { background: rgba(255,170,40,.85); color: #1a1000; border-color: transparent; }
  #toggle { font-size: 16px !important; padding: 11px 18px !important; }
  #stick { position: fixed; left: 22px; bottom: calc(env(safe-area-inset-bottom) + 26px); width: 128px; height: 128px; border-radius: 50%; background: rgba(255,255,255,.10); border: 1.5px solid rgba(255,255,255,.4); touch-action: none; }
  #knob { position: absolute; left: 39px; top: 39px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.55); pointer-events: none; }
  #msg { position: fixed; left: 0; right: 0; top: 45%; text-align: center; color: #fff; font: 600 15px -apple-system, system-ui, sans-serif; text-shadow: 0 1px 4px #000; pointer-events: none; padding: 0 24px; }
  #tag { position: fixed; left: 0; right: 0; top: 58%; text-align: center; pointer-events: none; }
  #tag span { display: inline-block; font: 700 13px -apple-system, system-ui, sans-serif; color: #fff; background: rgba(0,0,0,.45); padding: 4px 10px; border-radius: 12px; opacity: 0; transition: opacity .3s; }
  #tag span.show { opacity: 1; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">loading…</div>
<div id="tag"><span id="tagtext"></span></div>
<div id="msg">loading…</div>
<div id="stick"><div id="knob"></div></div>
<div id="bar">
  <button id="hudbtn">HUD</button>
  <button id="rec">● rec</button>
  <button id="modebtn">mode</button>
  <button id="steps">2 steps</button>
  <button id="toggle" class="on">3D</button>
</div>
<script type="module" src="/web/main.js"></script>
</body>
</html>
