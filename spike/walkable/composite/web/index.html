<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14110f">
<title>worlds · composite</title>
<style>
  html, body { margin: 0; height: 100%; background: #14110f; overflow: hidden; overscroll-behavior: none; }
  body { font: 13px/1.35 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; color: #fff; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; }
  #hud { position: fixed; top: calc(env(safe-area-inset-top) + 8px); left: 8px; max-width: calc(100vw - 80px); background: rgba(10, 10, 12, 0.55); border-radius: 10px; padding: 6px 9px; font: 10.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-word; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); pointer-events: auto; }
  #hud.hidden { display: none; }
  #buttons { position: fixed; top: calc(env(safe-area-inset-top) + 8px); right: 8px; display: flex; flex-direction: column; gap: 6px; }
  #buttons button { appearance: none; border: 0; border-radius: 10px; min-width: 52px; height: 36px; padding: 0 10px; font: 600 12px -apple-system, system-ui, sans-serif; color: #fff; background: rgba(10, 10, 12, 0.55); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  #buttons button.on { background: rgba(230, 70, 60, 0.85); }
  #joy { position: fixed; width: 116px; height: 116px; margin: -58px 0 0 -58px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.55); background: rgba(255, 255, 255, 0.1); display: none; pointer-events: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; background: rgba(255, 255, 255, 0.7); }
  #hint { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 18px); transform: translateX(-50%); padding: 7px 12px; border-radius: 999px; background: rgba(10, 10, 12, 0.5); font-size: 12px; white-space: nowrap; transition: opacity 0.8s; pointer-events: none; }
  #caption { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 58px); text-align: center; pointer-events: none; transition: opacity 1.2s; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6); }
  #caption .t { font: 700 22px/1.2 -apple-system, system-ui, sans-serif; }
  #caption .s { font-size: 13px; opacity: 0.9; margin-top: 4px; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: radial-gradient(circle at 50% 40%, #3a2c22, #14110f 70%); transition: opacity 0.6s; z-index: 5; }
  #loading .t { font: 700 20px -apple-system, system-ui, sans-serif; }
  #bar { width: 220px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.15); overflow: hidden; }
  #bar > div { height: 100%; width: 0; background: #f2b84b; transition: width 0.2s; }
  #loadinfo { font: 11px ui-monospace, Menlo, monospace; opacity: 0.8; max-width: 86vw; text-align: center; white-space: pre-wrap; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/",
    "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.18/build/index.module.js"
  }
}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading"><div class="t" id="loadtitle">Building your world…</div><div id="bar"><div></div></div><div id="loadinfo"></div></div>
<div id="hud"></div>
<div id="buttons"><button id="b-view">3P</button><button id="b-hud">HUD</button><button id="b-rec">REC</button></div>
<div id="joy"><div id="knob"></div></div>
<div id="caption"></div>
<div id="hint">drag left side to walk · drag right side to look</div>
<script type="module" src="./main.js"></script>
</body>
</html>
